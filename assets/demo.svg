<svg xmlns="http://www.w3.org/2000/svg" width="720" height="357" viewBox="0 0 720 357" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
<rect width="720" height="357" rx="10" fill="#0d1117"/>
<rect width="720" height="36" rx="10" fill="#161b22"/>
<rect y="26" width="720" height="10" fill="#161b22"/>
<circle cx="18" cy="18" r="6" fill="#ff5f56"/>
<circle cx="38" cy="18" r="6" fill="#ffbd2e"/>
<circle cx="58" cy="18" r="6" fill="#27c93f"/>
<text x="360" y="22" fill="#8b949e" text-anchor="middle" font-size="12">changelog-genie — releases in two commands</text>
<rect y="36" width="720" height="2" fill="#a371f7" opacity="0.65"/>
<text x="18" y="67" fill="#7ee787" xml:space="preserve">$ changelog-genie</text>
<text x="18" y="86" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="105" fill="#d2a8ff" xml:space="preserve">## v1.3.0 — 2026-09-11</text>
<text x="18" y="124" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="143" fill="#d2a8ff" xml:space="preserve">### ✨ Features</text>
<text x="18" y="162" fill="#c9d1d9" xml:space="preserve">- **cli:** `--tag` flag creates the release tag (`e4f5g6h`)</text>
<text x="18" y="181" fill="#c9d1d9" xml:space="preserve">- offline heuristic summarizer (`a1b2c3d`)</text>
<text x="18" y="200" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="219" fill="#d2a8ff" xml:space="preserve">### 🐛 Bug Fixes</text>
<text x="18" y="238" fill="#c9d1d9" xml:space="preserve">- null guard for empty diffs (`b2c3d4e`)</text>
<text x="18" y="257" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="276" fill="#e3b341" xml:space="preserve">ℹ bump: minor → v1.3.0 (since v1.2.0)</text>
<text x="18" y="295" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="314" fill="#7ee787" xml:space="preserve">$ changelog-genie | gh release create v1.3.0 --notes-file -</text>
<text x="18" y="333" fill="#7ee787" xml:space="preserve">✔ https://github.com/Dukk11/changelog-genie/releases/tag/v1.3.0</text>
</svg>